services:
  - type: web
    name: codeguard-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '[]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '43200'
      - key: MAX_FILE_SIZE
        value: '5242880'
      - key: ANALYSIS_TIMEOUT
        value: '120'

  - type: web
    name: codeguard-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          name: codeguard-api
          type: web
          property: hostport

databases:
  - name: codeguard-db
    plan: free
    region: oregon
    databaseName: codeguard
    user: codeguard
    postgresMajorVersion: '16'
